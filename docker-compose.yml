version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: streaming-memory-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: streaming-memory-app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
